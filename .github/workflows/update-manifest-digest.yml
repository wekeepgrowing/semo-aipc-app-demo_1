name: Sync Compose Digest

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
  workflow_dispatch:

jobs:
  sync-digest:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Resolve version and digest
        id: image
        run: |
          set -euo pipefail
          version=$(grep -oE 'ARG OPENCLAW_NPM_VERSION=[0-9]+(\.[0-9]+)*' Dockerfile | head -n1 | cut -d'=' -f2)
          image="ghcr.io/${{ github.repository }}:${version}"
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://${image}")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Update compose digest
        run: |
          set -euo pipefail
          version="${{ steps.image.outputs.version }}"
          digest="${{ steps.image.outputs.digest }}"

          sed -i -E "s#(image: ghcr.io/your-org/openclaw-our-os:${version}@)sha256:[a-f0-9]+#\\1${digest}#" ouros/openclaw/docker-compose.yml || true
          sed -i -E "s#(image: ghcr.io/your-org/openclaw-our-os:)[0-9]+(\.[0-9]+)*@sha256:[a-f0-9]+#\\1${version}@${digest}#" ouros/openclaw/docker-compose.yml

      - name: Create PR with digest update
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/openclaw-digest-${{ steps.image.outputs.version }}
          delete-branch: true
          commit-message: "chore: sync openclaw image digest (${{ steps.image.outputs.version }})"
          title: "chore: sync openclaw image digest (${{ steps.image.outputs.version }})"
          body: |
            Syncs `ouros/openclaw/docker-compose.yml` image digest to the latest pushed multi-arch digest.
