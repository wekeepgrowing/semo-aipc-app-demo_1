name: OpenClaw Release PR

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          current_version=$(grep -oE 'ARG OPENCLAW_NPM_VERSION=[0-9]+(\.[0-9]+)*' Dockerfile | head -n1 | cut -d'=' -f2)
          all_versions=$(npm view openclaw versions --json)
          latest_version=$(node -e 'const versions = JSON.parse(process.argv[1]); const arr = Array.isArray(versions) ? versions : [versions]; const stable = arr.filter(v => !v.includes("-")); if (!stable.length) process.exit(1); console.log(stable[stable.length - 1]);' "$all_versions")

          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "latest_version=${latest_version}" >> "$GITHUB_OUTPUT"

          if [[ "${current_version}" == "${latest_version}" ]]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update versioned files
        if: steps.versions.outputs.update_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          latest="${{ steps.versions.outputs.latest_version }}"

          sed -i -E "s/(ARG OPENCLAW_NPM_VERSION=)[0-9]+(\.[0-9]+)*/\\1${latest}/" Dockerfile
          sed -i -E "s/(version: \"?)[0-9]+(\.[0-9]+)*(\"?)/\\1${latest}\\3/" ouros/openclaw/manifest.yml
          sed -i -E "s#(image: ghcr.io/your-org/openclaw-our-os:)[0-9]+(\.[0-9]+)*#\\1${latest}#" ouros/openclaw/docker-compose.yml

      - name: Create or update PR
        if: steps.versions.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/openclaw-update-${{ steps.versions.outputs.latest_version }}
          delete-branch: true
          commit-message: "chore: bump openclaw to ${{ steps.versions.outputs.latest_version }}"
          title: "chore: bump openclaw to ${{ steps.versions.outputs.latest_version }}"
          body: |
            Automated OpenClaw update.

            - Current version: `${{ steps.versions.outputs.current_version }}`
            - Latest npm version: `${{ steps.versions.outputs.latest_version }}`

            After merge, tag + image publish + digest sync workflows run automatically.
          labels: |
            openclaw-update
